<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - Festa Junina Lolico</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <video autoplay muted loop playsinline class="video-bg">

        <source src="imagens/video.mp4.mp4" type="video/mp4">

    </video>

    <div class="overlay"></div>

    <div class="login-card">

        <h1>🌽 Festa Junina Lolico</h1>

        <p id="subtitulo">Bem-vindo!</p>


        <!-- ESCOLHA -->

        <div class="tipo-login">

    <button id="btn-cliente">
        👤 Cliente
    </button>

    <button id="btn-funcionario">
        🎟️ Funcionário
    </button>

    <button id="btn-admin">
        👑 Administração
    </button>

</div>


        <!-- MENSAGEM -->

        <div id="mensagem-login"></div>


        <!-- LOGIN CLIENTE -->

        <div id="login-cliente">

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    id="cpf-login"
                    placeholder="Digite seu CPF"
                    maxlength="14"
                >

            </div>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha-cliente"
                    placeholder="Digite sua senha"
                >

                <i
                    class="fa-solid fa-eye eye"
                    onclick="mostrarSenhaCliente()">
                </i>

            </div>


            <button onclick="loginCliente()">

                Entrar

            </button>


            <p class="link-cadastro">

                Ainda não possui conta?

                <span onclick="abrirCadastro()">
                    Criar cadastro
                </span>

            </p>

        </div>



        <!-- CADASTRO CLIENTE -->

        <div
            id="cadastro-cliente"
            style="display:none;"
        >

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input
                    type="text"
                    id="nome-cadastro"
                    placeholder="Nome completo"
                >

            </div>


            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input
                    type="text"
                    id="cpf-cadastro"
                    placeholder="CPF"
                    maxlength="14"
                >

            </div>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha-cadastro"
                    placeholder="Crie uma senha"
                >

            </div>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme sua senha"
                >

            </div>


            <button onclick="cadastrarCliente()">

                Criar Conta

            </button>


            <p class="link-cadastro">

                Já possui conta?

                <span onclick="voltarLoginCliente()">
                    Fazer login
                </span>

            </p>

        </div>

<!-- LOGIN FUNCIONÁRIO -->

<div
    id="login-funcionario"
    style="display:none;"
>

    <div class="input-box">

        <i class="fa-solid fa-envelope"></i>

        <input
            type="email"
            id="email-funcionario"
            placeholder="E-mail do funcionário"
        >

    </div>


    <div class="input-box">

        <i class="fa-solid fa-lock"></i>

        <input
            type="password"
            id="senha-funcionario"
            placeholder="Digite sua senha"
        >

        <i
            class="fa-solid fa-eye eye"
            onclick="mostrarSenhaFuncionario()">
        </i>

    </div>


    <button onclick="loginFuncionario()">
        Entrar
    </button>

</div>

        <!-- LOGIN ADMIN -->

        <div
            id="login-admin"
            style="display:none;"
        >

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                >

            </div>


            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                >

                <i
                    class="fa-solid fa-eye eye"
                    onclick="mostrarSenha()">
                </i>

            </div>


            <button onclick="fazerLogin()">

                Entrar

            </button>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>

</html>
